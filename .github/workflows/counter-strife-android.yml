name: Build Counter Strife Android APK

on:
  push:
    branches: [main]
    paths:
      - 'counter-strife/**'
      - 'sdk/**'
      - '.github/workflows/counter-strife-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android WebView project
        shell: bash
        run: |
          mkdir -p android-app/app/src/main/java/com/stumfgames/counterstrife
          mkdir -p android-app/app/src/main/assets/www
          cp -R counter-strife android-app/app/src/main/assets/www/
          cp -R sdk android-app/app/src/main/assets/www/
          cat > android-app/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'CounterStrife'
          include ':app'
          EOF
          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > android-app/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.stumfgames.counterstrife'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.stumfgames.counterstrife'
                  minSdk 23
                  targetSdk 35
                  versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
                  versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF
          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="Counter Strife" android:usesCleartextTraffic="false" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:screenOrientation="landscape" android:configChanges="orientation|screenSize|keyboardHidden" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > android-app/app/src/main/java/com/stumfgames/counterstrife/MainActivity.java <<'EOF'
          package com.stumfgames.counterstrife;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          public class MainActivity extends Activity {
            private WebView web;
            @Override public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN |
                View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
              web = new WebView(this);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(false);
              s.setAllowContentAccess(false);
              s.setSupportMultipleWindows(false);
              WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                .build();
              web.setWebViewClient(new WebViewClientCompat() {
                @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, android.webkit.WebResourceRequest request) {
                  return loader.shouldInterceptRequest(request.getUrl());
                }
              });
              web.setWebChromeClient(new WebChromeClient());
              web.setOverScrollMode(View.OVER_SCROLL_NEVER);
              setContentView(web);
              web.loadUrl("https://appassets.androidplatform.net/assets/www/counter-strife/index.html");
            }
            @Override public void onBackPressed() { if (web != null && web.canGoBack()) web.goBack(); else super.onBackPressed(); }
            @Override protected void onDestroy() { if (web != null) { web.destroy(); web = null; } super.onDestroy(); }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable debug-signed APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Publish APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Counter-Strife-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
