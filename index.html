<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STUMF Games</title><style>body{margin:0;background:#07090d;color:#eef;font:16px system-ui}main{max-width:1000px;margin:0 auto;padding:28px 16px}
h1{font:900 34px system-ui;margin:0 0 6px}.sub{opacity:.7;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
a.g{display:block;padding:18px;border-radius:14px;background:#111826;border:1px solid #243149;color:inherit;text-decoration:none}a.g:hover{border-color:#4f8cff}
a.g b{font-size:19px}a.g span{display:block;opacity:.7;font-size:14px;margin-top:6px}.foot{opacity:.5;font-size:13px;margin-top:26px}</style></head>
<body><main><h1>STUMF Games</h1><div class="sub">Free browser games made by STUMF. Play solo or with friends: host a lobby and share the code.</div>
<div class="grid" id="g"></div><div class="foot">Made by STUMF's BrowserDev · runs on any computer or phone · no downloads, no accounts</div></main>
<script>fetch('games.json').then(r=>r.json()).then(list=>{const g=document.getElementById('g');for(const x of list){const a=document.createElement('a');a.className='g';a.href=x.slug+'/';
const b=document.createElement('b');b.textContent=x.title;const s=document.createElement('span');s.textContent=x.tagline||'';a.append(b,s);g.append(a);}}).catch(()=>{});</script></body></html>
