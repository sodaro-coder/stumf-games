<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STUMF Games: free browser games, solo or with friends</title>
<meta name="description" content="Free browser games you can play right now on a phone or computer. Solo or with friends: host a lobby and share the code. No downloads, no accounts.">
<meta property="og:type" content="website"><meta property="og:title" content="STUMF Games"><meta property="og:description" content="Free browser games. Play solo or with friends, on any phone or computer. No downloads, no accounts.">
<meta name="twitter:card" content="summary"><meta name="theme-color" content="#07090d">
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 15% -10%,#1a2a55 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#3a1450 0,transparent 55%),#07090d;
color:#eef;font:clamp(15px,1rem + .2vw,17px)/1.55 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh}
main{max-width:1060px;margin:0 auto;padding:clamp(22px,5vw,48px) clamp(16px,4vw,24px) 48px}
h1{font:900 clamp(34px,8vw,64px)/1.02 system-ui,sans-serif;margin:0 0 10px;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,#9fc2ff 45%,#ff7ad9);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{opacity:.8;margin:0 0 22px;max-width:620px;font-size:1.08em}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px}
.chips span{padding:6px 12px;border-radius:999px;background:#ffffff10;border:1px solid #ffffff1f;font-size:.85em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
a.g{position:relative;display:flex;flex-direction:column;gap:6px;min-height:150px;padding:20px;border-radius:18px;background:linear-gradient(160deg,#141d31,#0d1220);border:1px solid #243149;color:inherit;text-decoration:none;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
a.g::before{content:"";position:absolute;inset:-40% -40% auto auto;width:180px;height:180px;border-radius:50%;background:var(--glow,#4f8cff);opacity:.18;filter:blur(30px)}
a.g:hover,a.g:focus-visible{transform:translateY(-3px);border-color:var(--glow,#4f8cff);box-shadow:0 14px 40px -18px var(--glow,#4f8cff);outline:none}
a.g .k{font-size:28px;line-height:1}a.g b{font-size:1.25em}a.g span{opacity:.75;font-size:.92em;flex:1}
a.g i{font-style:normal;align-self:flex-start;margin-top:8px;padding:10px 18px;min-height:44px;display:inline-flex;align-items:center;border-radius:12px;background:var(--glow,#4f8cff);color:#060814;font-weight:800}
a.g.first{grid-column:1/-1;min-height:190px}a.g.first b{font-size:clamp(1.5em,4vw,2em)}
.foot{opacity:.6;font-size:13px;margin-top:30px}@media (prefers-reduced-motion:reduce){a.g{transition:none}}</style></head>
<body><main><h1>STUMF Games</h1><p class="sub">Free browser games made by STUMF. Play solo, or host a lobby and share the code with friends.</p>
<div class="chips"><span>📱 Phone &amp; computer</span><span>👥 Multiplayer lobbies</span><span>⚡ No downloads</span><span>🔓 No accounts</span></div>
<div class="grid" id="g"><noscript>Turn on JavaScript to see the games.</noscript></div><div class="foot">Made by STUMF's BrowserDev · runs on any computer or phone · no downloads, no accounts</div></main>
<script>const K={tactical3d:['🎯','#ffb347'],arena2d:['🌀','#ff4fd8'],fps3d:['🧱','#59f0a0'],platformer2d:['🦘','#7cc4ff'],racer3d:['🏎️','#ffd84f']};
fetch('games.json').then(r=>r.json()).then(list=>{const g=document.getElementById('g');list.forEach((x,i)=>{const a=document.createElement('a');a.className='g'+(i?'':' first');a.href=x.slug+'/';
const k=K[x.kit]||['🎮','#4f8cff'];a.style.setProperty('--glow',k[1]);const e=document.createElement('div');e.className='k';e.textContent=k[0];
const b=document.createElement('b');b.textContent=x.title;const s=document.createElement('span');s.textContent=x.tagline||'';const p=document.createElement('i');p.textContent='Play free ▸';a.append(e,b,s,p);g.append(a);});}).catch(()=>{});</script></body></html>
